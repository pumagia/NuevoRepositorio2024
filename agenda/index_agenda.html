
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
    <link rel="stylesheet" href="stylesagenda.css">
</head>
<body>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 shadow">
                    <h2 class="text-center mb-4" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">Los Cardos - Concepción del Uruguay</h2>
                    <h3 class="text-center mb-4" style="font-family: fantasy; font-display: fallback;">Gestor de Reserva</h3>
                    <form id="reservationForm">
                        <div class="mb-3">
                            <label for="startDate" class="form-label">Fecha de ingreso:</label>
                            <input type="date" class="form-control" id="startDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="endDate" class="form-label">Fecha de Egreso:</label>
                            <input type="date" class="form-control" id="endDate" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-secondary">Reservar</button>
                        </div>
<br>
                        <div class="d-grid">
                            <a href="/"  id="volver">
                                <button  type="button" class="btn  btn-primary"
                                onclick="window.location.href = '/'; window.location.reload(true); localStorage.clear;">Volver</button>
                           </a>


                        </div>
                    </form>

                        
                    <div class="alert mt-4 text-center" id="message" style="display: none;"></div>
                  <div class="col-md-12">
                        
                    <div id="calendar"></div>
                    <div class="mt-3 text-center">
                    
                    </div>
                  </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/es.js'></script>
    <script src="scriptagenda.js"></script>
</body>
</html>
